<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', monospace; }
    .t   { font-size: 96px; font-weight: 700; }
    .w   { fill: #e8e8e8; }
    .r   { fill: #ff2d55; mix-blend-mode: screen; animation: gr 5s infinite steps(1); }
    .c   { fill: #00e5ff; mix-blend-mode: screen; animation: gc 5s infinite steps(1); }
    .lab { font-size: 13px; fill: #4d5a5a; letter-spacing: 6px; }
    .sub { font-size: 16px; fill: #7a8a8a; letter-spacing: 5px; }
    .cur { fill: #e8e8e8; animation: bl 1s infinite steps(1); }
    .bar { animation: scan 7s linear infinite; }
    @keyframes bl { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
    @keyframes gr {
      0%,90%,100% { transform: translate(0,0); }
      91% { transform: translate(-7px,2px); }
      94% { transform: translate(6px,-1px); }
      97% { transform: translate(-3px,0); }
    }
    @keyframes gc {
      0%,90%,100% { transform: translate(0,0); }
      92% { transform: translate(7px,-2px); }
      95% { transform: translate(-5px,1px); }
    }
  </style>
  <defs>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".4"/>
    </pattern>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="#07090b"/>

  <text x="60" y="52" class="lab">LAYER 00</text>

  <g transform="translate(60,150)">
    <text class="t r">adi</text>
    <text class="t c">adi</text>
    <text class="t w">adi</text>
    <rect class="cur" x="190" y="-72" width="14" height="72"/>
  </g>

  <text x="62" y="195" class="sub">BACKEND · GO / PYTHON · TOKYO</text>

  <rect class="bar" x="0" y="-40" width="900" height="40" fill="url(#g)"/>
  <rect width="900" height="260" fill="url(#sl)"/>
</svg>
